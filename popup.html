<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width:280px; margin:0; padding:16px;
        font-family:system-ui,-apple-system,sans-serif; font-size:13px; color:#111; }
      h1 { font-size:15px; margin:0 0 4px; }
      .sub { color:#666; margin-bottom:14px; }
      button { width:100%; padding:10px; border:none; border-radius:8px;
        font-weight:600; font-size:13px; cursor:pointer; color:#fff; margin-bottom:8px; }
      #activate { background:#1a73e8; }
      #activate:disabled { background:#ccc; cursor:not-allowed; }
      #deactivate { background:#d93025; }
      .hidden { display:none; }
      .msg { margin-top:6px; line-height:1.4; }
      .ok { color:#137333; }
      .err { color:#d93025; }
      .note { margin-top:14px; font-size:11px; color:#888; line-height:1.5; }
    </style>
  </head>
  <body>
    <h1>AI Meeting Copilot</h1>
    <div class="sub" id="tabState">Checking tab…</div>

    <button id="activate" disabled>Activate Copilot</button>
    <button id="deactivate" class="hidden">Stop Meeting Audio</button>

    <div class="msg" id="msg"></div>

    <div class="note">
      API key lives in config.js. Let participants know the meeting is being
      transcribed.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
