<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Salesforce OAuth Callback</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1e2025;
        color: #f1f3f4;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #252830;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        max-width: 360px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #1a73e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h3>Connecting to Salesforce…</h3>
      <p style="font-size: 13px; color: #9aa0a6;">Completing secure OAuth 2.0 handshake. You may close this window.</p>
    </div>
    <script>
      (() => {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash || window.location.search);
        const accessToken = params.get("access_token");
        const instanceUrl = params.get("instance_url");
        const code = params.get("code");

        if (accessToken || code) {
          chrome.storage.local.set({
            sf_access_token: accessToken,
            sf_instance_url: instanceUrl,
            sf_connected_at: Date.now()
          }, () => {
            window.close();
          });
        }
      })();
    </script>
  </body>
</html>
